services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zerodha_dashboard
      POSTGRES_USER: zerodha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerodha -d zerodha_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://zerodha:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/zerodha_dashboard
      RATELIMIT_STORAGE: database
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      AI_CATEGORIZATION_ENABLED: ${AI_CATEGORIZATION_ENABLED:-true}
      # From inside the container, the host's localhost is reached via
      # host.docker.internal (mapped below through extra_hosts).
      AI_CATEGORIZATION_BASE_URL: ${AI_CATEGORIZATION_BASE_URL:-http://host.docker.internal:20128/v1}
      AI_CATEGORIZATION_MODEL: ${AI_CATEGORIZATION_MODEL:-openrouter/openrouter/free}
      AI_CATEGORIZATION_API_KEY: ${AI_CATEGORIZATION_API_KEY:-}
      AI_CATEGORIZATION_TIMEOUT: ${AI_CATEGORIZATION_TIMEOUT:-30}
      AI_CATEGORIZATION_MAX_TOKENS: ${AI_CATEGORIZATION_MAX_TOKENS:-2048}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_instance:/app/instance
      - statement_uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: zerodha_dashboard

volumes:
  postgres_data:
  backend_instance:
  statement_uploads: